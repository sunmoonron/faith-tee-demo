<style>

<script>
(function () {
'use strict';

/* Site config. The handover swaps scriptUrl and token (and the CSV links if used). */
var CONFIG = {
  storeName: 'Qivgu',
  siteUrl: 'https://qivgu.com/',
  scriptUrl: '',        /* Apps Script web app URL ending in /exec. Empty: sample shop, nothing is recorded */
  token: '',            /* same value as the token row in the Settings tab */
  productsCsvUrl: '',   /* optional: the Products tab published to the web as CSV, used if scriptUrl is empty or fails */
  reviewsCsvUrl: '',    /* optional: the Reviews tab published to the web as CSV */
  imageBase: 'img/',    /* image file names in the sheet resolve against docs/img/ */
  contactEmail: '',     /* fallbacks for the footer when the sheet's Settings are not loaded */
  instagram: '',
  musicUrl: '',
  musicLabel: 'Play the song',
  musicCredit: ''
};

var DEFAULTS = {
  hook_line: "Don't just read the Word, wear it",
  delivery_line: 'Free delivery in the GTA. Pay cash or e-Transfer at the door.',
  gta_enabled: 'yes', pickup_enabled: 'yes', ship_enabled: 'no', ship_rate: 12, ship_free_over: 0, tax_rate: 0, max_qty: 10,
  gta_instructions: 'We text you to arrange a delivery time. Have {total} in cash ready, or send an e-Transfer to {etransfer} with {number} in the message before we arrive.',
  pickup_instructions: 'Bring {total} in cash, or send an e-Transfer to {etransfer} with {number} in the message.',
  ship_instructions: 'Send an e-Transfer of {total} to {etransfer} with {number} in the message. We ship within a few days of it arriving and email you when it is on its way.'
};

/* Shown only when no sheet is configured. Every line here is a stand-in for the owners' own content.
   The products are the four real designs under working names; the photos are in docs/img/, front first, back second. */
var SAMPLE = {
  announcement: 'Sample shop. The products, prices and reviews are examples.',
  settings: {
    store_name: 'Qivgu', contact_email: 'info@example.com', instagram: '@yourhandle', etransfer_email: 'info@example.com',
    ship_enabled: 'yes', ship_rate: 12, ship_free_over: 150,
    pickup_note: 'Pickup at the church after the Sunday service or at the rink on Tuesday evenings. We text you to confirm.',
    story: 'Qivgu started at a Toronto skating rink, where two friends printed a few shirts for the people they skate with. We print in Toronto, hold our own stock and deliver it ourselves.',
    giveback_line: 'Part of every order goes to our church.'
  },
  promos: { FAITH10: { code: 'FAITH10', type: 'percent', value: 10 } },
  products: [
    { id: 'poweredbygod', name: 'Powered by God', price: 35, youth_price: 28, verse: '', description: 'Front: "AI, Authentic Intelligence, Powered by God" around a smiling face and a cross. Back: "Living the Word" in bold comic lettering. Ring-spun cotton, regular fit, screen printed in Toronto. Machine wash cold, inside out. Hang to dry.', colours: 'White #f2f2f2', sizes_mens: 'S, M, L, XL', sizes_womens: 'S, M, L', sizes_youth: 'YS, YM, YL', sold_out_sizes: '', images: 'poweredbygod-front.jpg; poweredbygod-back.jpg', active: 'yes' },
    { id: 'bestai', name: 'The best AI', price: 35, youth_price: 28, verse: '2 Corinthians 5:7', description: 'Front: "The best AI (Authentic Intelligence) is in my faith". Back: "Walk by faith, not by sight" over a mountain path, with 2 Corinthians 5:7. Ring-spun cotton, regular fit, screen printed in Toronto. Machine wash cold, inside out. Hang to dry.', colours: 'White #f2f2f2', sizes_mens: 'S, M, L, XL', sizes_womens: 'S, M, L', sizes_youth: 'YS, YM, YL', sold_out_sizes: '', images: 'bestai-front.jpg; bestai-back.jpg', active: 'yes' },
    { id: 'bible', name: 'B.I.B.L.E.', price: 35, youth_price: 28, verse: '', description: 'Front: the acrostic "Basic Instructions Before Leaving Earth". Back: an open Bible under a rising sun, above the Earth. Ring-spun cotton, regular fit, screen printed in Toronto. Machine wash cold, inside out. Hang to dry.', colours: 'White #f2f2f2', sizes_mens: 'S, M, L, XL', sizes_womens: 'S, M, L', sizes_youth: 'YS, YM, YL', sold_out_sizes: '', images: 'bible-front.jpg; bible-back.jpg', active: 'yes' },
    { id: 'garden', name: 'Garden of the Silicon Valley', price: 35, youth_price: 28, verse: '', description: 'Front: two robots at the tree with the serpent, and the words "In the Garden of the Silicon Valley, mankind said, Do not eat from the fruit of the tree. Satan said, Eat and you will be more powerful than mankind." The back is plain. Ring-spun cotton, regular fit, screen printed in Toronto. Machine wash cold, inside out. Hang to dry.', colours: 'White #f2f2f2', sizes_mens: 'S, M, L, XL', sizes_womens: 'S, M, L', sizes_youth: 'YS, YM, YL', sold_out_sizes: '', images: 'garden-front.jpg', active: 'yes' }
  ],
  reviews: [
    { product: 'poweredbygod', order: 'QV-1001', name: 'Priya', stars: 5, text: 'Fits true to size and the print has not cracked after a dozen washes.' },
    { product: 'bestai', order: 'QV-1002', name: 'Marcus', stars: 4, text: 'Runs a little large. I ordered a medium and it fits like a large.' }
  ]
};

var DATA = { products: [], reviews: [], settings: {}, demo: false, loaded: false, error: false };
var cart = loadCart();
var sel = { id: null, colour: '', range: '', size: '', qty: 1 };
var draft = { name: '', phone: '', email: '', delivery: '', address: '', postal: '', promo: '', consent: false };
var orderRef = '';
var lastOrder = null;
var view = document.getElementById('view');

/* ---------- data ---------- */

function loadData() {
  if (!CONFIG.scriptUrl && !CONFIG.productsCsvUrl) {
    DATA.demo = true;
    DATA.products = SAMPLE.products.map(normalizeProduct);
    DATA.reviews = SAMPLE.reviews.slice();
    DATA.settings = SAMPLE.settings;
    DATA.loaded = true;
    return Promise.resolve();
  }
  var viaScript = CONFIG.scriptUrl
    ? fetch(CONFIG.scriptUrl + '?action=catalog', { cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok || !j.products) throw new Error('bad catalog');
        DATA.products = j.products.map(normalizeProduct).filter(function (p) { return p.active && p.name; });
        DATA.reviews = (j.reviews || []).filter(function (r) { return r.text; });
        DATA.settings = j.settings || {};
        DATA.loaded = true;
      })
    : Promise.reject(new Error('no script url'));
  return viaScript.catch(function () {
    if (!CONFIG.productsCsvUrl) throw new Error('no csv');
    return fetch(CONFIG.productsCsvUrl, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      DATA.products = csvRows(t).map(normalizeProduct).filter(function (p) { return p.active && p.name; });
      DATA.loaded = true;
      if (!CONFIG.reviewsCsvUrl) return;
      return fetch(CONFIG.reviewsCsvUrl, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t2) {
        DATA.reviews = csvRows(t2).filter(function (r) { return yes(r.approved) && (r.text || r.review); }).map(function (r) {
          return { product: r.product, order: r.order || r.order_number || '', name: r.name, stars: num(r.stars), text: r.text || r.review };
        });
      }).catch(function () { });
    });
  }).catch(function () { DATA.error = true; DATA.loaded = true; });
}

function csvRows(text) {
  var rows = [], row = [], field = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  rows = rows.filter(function (r) { return r.some(function (c) { return c !== ''; }); });
  if (!rows.length) return [];
  var headers = rows[0].map(function (h) { return h.trim().toLowerCase().replace(/\s+/g, '_'); });
  return rows.slice(1).map(function (r) { var o = {}; headers.forEach(function (h, c) { if (h) o[h] = r[c] === undefined ? '' : r[c]; }); return o; });
}

function normalizeProduct(r) {
  var g = function (k) { return r[k] === undefined || r[k] === null ? '' : String(r[k]).trim(); };
  var colours = list(g('colours') || g('colors')).map(function (e) {
    var m = e.match(/^(.*?)\s*(#[0-9a-fA-F]{3,8})?$/);
    var name = (m ? m[1] : e).trim();
    return { name: name, hex: m && m[2] ? m[2] : guessHex(name) };
  }).filter(function (c) { return c.name; });
  var names = colours.map(function (c) { return c.name; });
  var p = {
    id: g('id') || slug(g('name')), name: g('name'), price: num(g('price')), youthPrice: num(g('youth_price')), verse: g('verse'),
    description: g('description'), colours: colours,
    sizes: { mens: list(g('sizes_mens')), womens: list(g('sizes_womens')), youth: list(g('sizes_youth')) },
    isNew: yes(g('new')), active: g('active') === '' || yes(g('active'))
  };
  p.soldOut = parseSoldOut(g('sold_out_sizes'), names);
  p.images = parseImages(g('images'), names);
  p.allSoldOut = isAllSoldOut(p);
  return p;
}

function parseSoldOut(text, names) {
  var lower = names.map(function (n) { return n.toLowerCase(); });
  return list(text).map(function (t) { return t.toLowerCase().replace(/['’.]/g, '').replace(/\s+/g, ' ').trim(); }).filter(Boolean).map(function (t) {
    if (t === 'all' || t === 'everything') return { all: true };
    var colour = '';
    for (var i = 0; i < lower.length; i++) {
      if (t.indexOf(lower[i] + ' ') === 0) { colour = names[i]; t = t.slice(lower[i].length + 1); break; }
    }
    var words = t.split(' ');
    var range = rangeKey(words[0]);
    return { colour: colour, range: range, size: range ? words.slice(1).join(' ') : t };
  });
}

function isSoldOut(p, colour, range, size) {
  var s = String(size).toLowerCase();
  for (var i = 0; i < p.soldOut.length; i++) {
    var t = p.soldOut[i];
    if (t.all) return true;
    if (t.colour && t.colour.toLowerCase() !== String(colour).toLowerCase()) continue;
    if (t.range && t.range !== range) continue;
    if (!t.size || t.size === s) return true;
  }
  return false;
}

function isAllSoldOut(p) {
  var colours = p.colours.length ? p.colours.map(function (c) { return c.name; }) : [''];
  var any = false;
  for (var r in p.sizes) {
    for (var i = 0; i < p.sizes[r].length; i++) {
      for (var c = 0; c < colours.length; c++) {
        any = true;
        if (!isSoldOut(p, colours[c], r, p.sizes[r][i])) return false;
      }
    }
  }
  return any ? true : true;
}

function parseImages(text, names) {
  var lower = names.map(function (n) { return n.toLowerCase(); });
  return list(text).map(function (e) {
    var m = e.match(/^([^:=]+)\s*[:=]\s*(.+)$/);
    if (m && lower.indexOf(m[1].trim().toLowerCase()) >= 0) return { colour: names[lower.indexOf(m[1].trim().toLowerCase())], url: imageUrl(m[2].trim()) };
    return { colour: '', url: imageUrl(e) };
  }).filter(function (i) { return i.url; });
}

function imageUrl(file) {
  if (!file) return '';
  if (/^(https?:)?\/\//.test(file) || file.indexOf('/') === 0) return file;
  return CONFIG.imageBase + file;
}

function imagesFor(p, colour) {
  var mine = p.images.filter(function (i) { return !i.colour || i.colour === colour; });
  return mine.length ? mine : p.images;
}

function firstImage(p) {
  var imgs = imagesFor(p, p.colours.length ? p.colours[0].name : '');
  return imgs.length ? imgs[0].url : '';
}

function guessHex(name) {
  var n = name.toLowerCase();
  var table = [['black', '#111111'], ['white', '#f2f2f2'], ['navy', '#1b2a49'], ['charcoal', '#333333'], ['heather', '#9aa1a9'], ['grey', '#8a8f94'], ['gray', '#8a8f94'],
    ['sand', '#d9cbaa'], ['cream', '#f1e9d8'], ['natural', '#ece6d6'], ['oat', '#e3d7bf'], ['red', '#b3261e'], ['maroon', '#6b1e2e'], ['burgundy', '#6b1e2e'],
    ['royal', '#2a5bd7'], ['blue', '#2a5bd7'], ['forest', '#23513e'], ['olive', '#6b7a4b'], ['green', '#2e7d4f'], ['pink', '#e8a3bb'], ['brown', '#5b3a29'], ['tan', '#c9a36b']];
  for (var i = 0; i < table.length; i++) if (n.indexOf(table[i][0]) >= 0) return table[i][1];
  return '#dddddd';
}

function rangeKey(word) {
  var w = String(word || '').toLowerCase().replace(/['’.]/g, '');
  if (/^(mens|men|man|male|adult)$/.test(w)) return 'mens';
  if (/^(womens|women|woman|ladies|female)$/.test(w)) return 'womens';
  if (/^(youth|youths|kids|kid|child|children|boys|girls)$/.test(w)) return 'youth';
  return '';
}

function rangeLabel(r) { return r === 'mens' ? "Men's" : r === 'womens' ? "Women's" : 'Youth'; }

function findProduct(id) {
  for (var i = 0; i < DATA.products.length; i++) if (DATA.products[i].id === id) return DATA.products[i];
  return null;
}

function settings() { return DATA.settings || {}; }
function setting(k) { var v = settings()[k]; if (v === undefined || v === null || v === '') v = DEFAULTS[k]; return v === undefined ? '' : v; }
function storeName() { return String(setting('store_name') || CONFIG.storeName); }
function contactEmail() { return String(setting('contact_email') || CONFIG.contactEmail); }
function maxQty() { return Math.max(1, Math.floor(num(setting('max_qty')) || 10)); }
function on(k) { return yes(setting(k)); }

/* ---------- cart ---------- */

function loadCart() {
  try {
    var s = JSON.parse(localStorage.getItem('qivgu-cart'));
    if (s && Array.isArray(s.items)) return { items: s.items, promo: s.promo || null };
  } catch (e) { }
  return { items: [], promo: null };
}
function saveCart() { try { localStorage.setItem('qivgu-cart', JSON.stringify(cart)); } catch (e) { } }
function pruneCart() {
  cart.items = cart.items.filter(function (l) { var p = findProduct(l.id); return p && p.sizes[l.range] && p.sizes[l.range].indexOf(l.size) >= 0; });
  saveCart();
}
function cartCount() { return cart.items.reduce(function (a, l) { return a + l.qty; }, 0); }
function renderCartCount() { document.getElementById('cartLink').textContent = 'Cart (' + cartCount() + ')'; }

function linePrice(l) {
  var p = findProduct(l.id);
  if (!p) return 0;
  return l.range === 'youth' && p.youthPrice > 0 ? p.youthPrice : p.price;
}

function totals(delivery) {
  var subtotal = 0;
  cart.items.forEach(function (l) { subtotal += linePrice(l) * l.qty; });
  subtotal = round2(subtotal);
  var discount = 0;
  if (cart.promo) discount = cart.promo.type === 'amount' ? Math.min(num(cart.promo.value), subtotal) : round2(subtotal * num(cart.promo.value) / 100);
  var after = round2(subtotal - discount);
  var shipping = 0;
  if (delivery === 'ship') {
    var free = num(setting('ship_free_over'));
    shipping = free > 0 && after >= free ? 0 : round2(num(setting('ship_rate')));
  }
  var tax = round2((after + shipping) * num(setting('tax_rate')) / 100);
  return { subtotal: subtotal, discount: round2(discount), shipping: shipping, tax: tax, total: round2(after + shipping + tax) };
}

/* ---------- views ---------- */

function route() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/');
  if (!DATA.loaded) { view.innerHTML = '<p>Loading the shop.</p>'; return; }
  if (DATA.error) { view.innerHTML = '<p>The shop could not load. Try again in a minute' + (contactEmail() ? ', or email ' + esc(contactEmail()) : '') + '.</p>'; return; }
  window.scrollTo(0, 0);
  document.title = storeName();
  if (parts[0] === 'p' && parts[1]) return renderProduct(decodeURIComponent(parts[1]));
  if (parts[0] === 'cart') return renderCart();
  if (parts[0] === 'checkout') return renderCheckout();
  if (parts[0] === 'order') return renderConfirmation();
  if (parts[0] === 'faq') return renderFaq();
  if (parts[0] === 'policies') return renderPolicies();
  renderHome();
  if (parts[0] === 'about') { var el = document.getElementById('about'); if (el) el.scrollIntoView(); }
}

function renderHome() {
  var tiles = DATA.products.map(tileHtml).join('');
  var hook = setting('hook_line'), delivery = setting('delivery_line'), story = setting('story'), give = setting('giveback_line');
  view.innerHTML = '<div class="grid">' + (tiles || '<p>No products yet.</p>') + '</div><hr><div class="about" id="about">' +
    (hook ? '<p class="hook">' + esc(hook) + '</p>' : '') +
    (delivery ? '<p>' + esc(delivery) + '</p>' : '') +
    (story ? '<p>' + esc(story) + '</p>' : '') +
    (give ? '<p>' + esc(give) + '</p>' : '') + '</div>';
}

function tileHtml(p) {
  var img = firstImage(p);
  var badge = p.allSoldOut ? '<p>Sold out</p>' : p.isNew ? '<p>New</p>' : '';
  return '<article class="tile"><a href="#p/' + encodeURIComponent(p.id) + '"><div class="photo"><span>' + esc(p.name) + '</span>' +
    (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div><h3>' + esc(p.name) + '</h3><p>' + money(p.price) + '</p>' + badge + '</a></article>';
}

function renderProduct(id) {
  var p = findProduct(id);
  if (!p) { view.innerHTML = '<h1>Not found</h1><p>That product is not in the shop any more. <a href="#shop">Back to the shop</a></p>'; return; }
  if (sel.id !== p.id) sel = { id: p.id, colour: p.colours.length ? p.colours[0].name : '', range: '', size: '', qty: 1 };
  document.title = p.name + ', ' + storeName();
  var imgs = imagesFor(p, sel.colour);
  var photos = imgs.length
    ? imgs.map(function (i, n) { return '<div class="photo"><span>' + esc(p.name) + '</span><img src="' + esc(i.url) + '" alt="' + esc(p.name + (n === 0 ? ', front' : n === 1 ? ', back' : '')) + '" onerror="this.remove()"></div>'; }).join('')
    : '<div class="photo"><span>' + esc(p.name) + '</span></div>';
  var hasYouth = p.sizes.youth.length > 0 && p.youthPrice > 0;
  var price = money(p.price) + (hasYouth ? '. Youth ' + money(p.youthPrice) : '');
  var colours = p.colours.length ? '<label>Colour</label><div class="swatches">' + p.colours.map(function (c) {
    return '<button type="button" class="swatch" data-colour="' + esc(c.name) + '" aria-pressed="' + (c.name === sel.colour) + '"><i style="background:' + esc(c.hex) + '"></i>' + esc(c.name) + '</button>';
  }).join('') + '</div>' : '';
  var sizes = ['mens', 'womens', 'youth'].filter(function (r) { return p.sizes[r].length; }).map(function (r) {
    var head = rangeLabel(r) + (r === 'youth' && hasYouth ? ' (' + money(p.youthPrice) + ')' : '');
    return '<p class="rangename">' + esc(head) + '</p><div class="sizes">' + p.sizes[r].map(function (s) {
      var out = isSoldOut(p, sel.colour, r, s);
      return '<button type="button" data-range="' + r + '" data-size="' + esc(s) + '" aria-pressed="' + (sel.range === r && sel.size === s) + '"' + (out ? ' disabled aria-label="' + esc(s + ', sold out') + '"' : '') + '>' + esc(s) + '</button>';
    }).join('') + '</div>';
  }).join('');
  var qty = '<div class="row"><label for="qty">Quantity</label><select id="qty">' + range1(maxQty()).map(function (n) { return '<option' + (n === sel.qty ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>';
  var buy = p.allSoldOut ? '<p>Sold out.</p>' : colours + '<label>Size</label>' + sizes + qty + '<p><button type="button" class="btn" id="add">Add to cart</button></p><p id="addMsg"></p>';
  var reviews = DATA.reviews.filter(function (r) { return String(r.product).trim().toLowerCase() === p.id.toLowerCase() || String(r.product).trim().toLowerCase() === p.name.toLowerCase(); });
  var reviewUrl = reviewLink(p.id, '');
  var reviewHtml = '<div class="reviews"><h2>Reviews</h2>' + (reviews.length ? '<ul>' + reviews.map(function (r) {
    var n = Math.max(0, Math.min(5, Math.round(num(r.stars))));
    return '<li><span class="stars" aria-label="' + n + ' out of 5">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</span> ' + esc(r.name || 'A customer') + (r.order ? ', order ' + esc(r.order) : '') + '<br>' + esc(r.text) + '</li>';
  }).join('') + '</ul>' : '<p>No reviews yet.</p>') + (reviewUrl ? '<p><a href="' + esc(reviewUrl) + '" target="_blank" rel="noopener">Leave a review</a></p>' : '') + '</div>';
  view.innerHTML = '<div class="product"><div class="photos">' + photos + '</div><div>' +
    '<h1>' + esc(p.name) + '</h1>' + (p.verse ? '<p>' + esc(p.verse) + '</p>' : '') + '<p>' + price + '</p>' + buy +
    (p.description ? '<p>' + esc(p.description) + '</p>' : '') + (setting('delivery_line') ? '<p>' + esc(setting('delivery_line')) + '</p>' : '') +
    reviewHtml + '</div></div>';

function renderCart() {
  document.title = 'Cart, ' + storeName();
  if (!cart.items.length) { view.innerHTML = '<h1>Cart</h1><p>Your cart is empty.</p><p><a href="#shop">Back to the shop</a></p>'; return; }
  var blocked = false;
  var lines = cart.items.map(function (l, n) {
    var p = findProduct(l.id);
    var out = isSoldOut(p, l.colour, l.range, l.size);
    if (out) blocked = true;
    return '<div class="line"><p><a href="#p/' + encodeURIComponent(p.id) + '">' + esc(p.name) + '</a>' + (l.colour ? ', ' + esc(l.colour) : '') + ', ' + rangeLabel(l.range) + ' ' + esc(l.size) + '</p>' +
      '<div class="row"><label for="q' + n + '">Quantity</label><select id="q' + n + '" data-qty="' + n + '">' + range1(maxQty()).map(function (k) { return '<option' + (k === l.qty ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select>' +
      '<span>' + money(linePrice(l) * l.qty) + '</span><button type="button" class="textbtn" data-remove="' + n + '">Remove</button></div>' +

  }).join('');

function deliveryOptions() {
  var opts = [];
  var rate = num(setting('ship_rate')), free = num(setting('ship_free_over'));
  if (on('gta_enabled')) opts.push({ value: 'gta', text: 'Free delivery in the GTA, to postal codes starting with M or L. Pay cash or e-Transfer at the door.' });
  if (on('pickup_enabled')) opts.push({ value: 'pickup', text: 'Pickup. ' + (setting('pickup_note') || 'We text you to arrange it.') });
  if (on('ship_enabled')) opts.push({ value: 'ship', text: 'Shipping within Ontario, ' + money(rate) + ' per order' + (free > 0 ? ', free over ' + money(free) : '') + '. Send the e-Transfer first and we ship when it arrives.' });
  return opts;
}

  if (!draft.delivery || !opts.some(function (o) { return o.value === draft.delivery; })) draft.delivery = opts.length ? opts[0].value : '';
  if (!orderRef) orderRef = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var t = totals(draft.delivery);
  var needsAddress = draft.delivery === 'gta' || draft.delivery === 'ship';
  var lines = cart.items.map(function (l) { var p = findProduct(l.id); return '<tr><td>' + l.qty + ' x ' + esc(p.name) + (l.colour ? ', ' + esc(l.colour) : '') + ', ' + rangeLabel(l.range) + ' ' + esc(l.size) + '</td><td>' + money(linePrice(l) * l.qty) + '</td></tr>'; }).join('');

    '<fieldset><legend>Delivery</legend>' + opts.map(function (o) {
      return '<label class="choice"><input type="radio" name="delivery" value="' + o.value + '"' + (draft.delivery === o.value ? ' checked' : '') + '><span>' + esc(o.text) + '</span></label>';
    }).join('') + '<p class="err" id="err-delivery"></p></fieldset>' +
    '<div id="addressFields"' + (needsAddress ? '' : ' class="hidden"') + '><div class="field"><label for="address">Address (street, unit, city)</label><textarea id="address" autocomplete="street-address">' + esc(draft.address) + '</textarea><p class="err" id="err-address"></p></div>' +
    '<div class="field"><label for="postal">Postal code</label><input id="postal" autocomplete="postal-code" style="max-width:160px" value="' + esc(draft.postal) + '"><p class="err" id="err-postal"></p></div></div>' +
    '<div class="field"><label for="promo">Promo code</label><div class="row"><input id="promo" style="max-width:200px" value="' + esc(cart.promo ? cart.promo.code : draft.promo) + '" autocomplete="off"><button type="button" class="textbtn" id="applyPromo">Apply</button></div><p id="promoMsg"' + (cart.promo ? '' : ' class="err"') + '>' + (cart.promo ? esc(cart.promo.code) + ' applied.' : '') + '</p></div>' +
    '<label class="choice"><input type="checkbox" id="consent"' + (draft.consent ? ' checked' : '') + '><span>Email me when new designs come out.</span></label>' +
    '<label class="hp" for="website">Leave this empty</label><input class="hp" type="text" id="website" tabindex="-1" autocomplete="off">' +
    '<h2>Your order</h2><table class="totals">' + lines +
    '<tr><td>Subtotal</td><td>' + money(t.subtotal) + '</td></tr>' +
    (t.discount ? '<tr><td>Discount (' + esc(cart.promo.code) + ')</td><td>-' + money(t.discount) + '</td></tr>' : '') +
    (draft.delivery === 'ship' ? '<tr><td>Shipping</td><td>' + (t.shipping ? money(t.shipping) : 'Free') + '</td></tr>' : '') +
    (t.tax ? '<tr><td>Tax</td><td>' + money(t.tax) + '</td></tr>' : '') +
    '<tr class="total"><td>Total</td><td>' + money(t.total) + '</td></tr></table>' +
    '<p><button type="submit" class="btn" id="place">Place order</button></p><p class="err" id="err-form"></p></form>';
}

function field(id, label, type, auto) {
  return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" autocomplete="' + auto + '" value="' + esc(draft[id]) + '"><p class="err" id="err-' + id + '"></p></div>';
}

function readDraft() {
  var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var d = document.querySelector('input[name="delivery"]:checked');
  draft = { name: g('name'), phone: g('phone'), email: g('email'), delivery: d ? d.value : '', address: g('address'), postal: g('postal'), promo: g('promo'), consent: !!(document.getElementById('consent') || {}).checked };
  return draft;
}

function validateDraft(d) {
  var errors = {};
  if (d.name.length < 2) errors.name = 'Enter your name.';
  if (d.phone.replace(/\D/g, '').length < 10) errors.phone = 'Enter a phone number with the area code.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) errors.email = 'Enter a valid email address.';
  var postal = d.postal.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!d.delivery) errors.delivery = 'Choose how you want to get your order.';
  if (d.delivery === 'gta') {
    if (!/^[ML]\d[A-Z]\d[A-Z]\d$/.test(postal)) errors.postal = 'We deliver to postal codes starting with M or L. Check the postal code, or choose pickup.';
    if (d.address.length < 5) errors.address = 'Enter the delivery address.';
  }
  if (d.delivery === 'ship') {
    if (!/^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(postal)) errors.postal = 'Enter a valid postal code.';
    else if (!/^[KLMNP]/.test(postal)) errors.postal = 'We only ship within Ontario.';
    if (d.address.length < 5) errors.address = 'Enter the shipping address.';
  }
  return errors;
}

function showErrors(errors) {
  ['name', 'phone', 'email', 'delivery', 'address', 'postal', 'form'].forEach(function (k) {
    var el = document.getElementById('err-' + k);
    if (el) el.textContent = errors[k] || '';
    var input = document.getElementById(k);
    if (input && input.tagName !== 'FORM') { if (errors[k]) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid'); }
  });
  var first = Object.keys(errors)[0];
  if (first) { var f = document.getElementById(first); if (f && f.focus) f.focus(); }
}

function applyPromo() {
  readDraft();
  var code = draft.promo.toUpperCase();
  var msg = document.getElementById('promoMsg');
  if (!code) { cart.promo = null; saveCart(); renderCheckout(); return; }
  var t = totals(draft.delivery);
  var done = function (res) {
    if (res && res.ok) { cart.promo = { code: res.code, type: res.type, value: res.value }; saveCart(); renderCheckout(); }
    else { cart.promo = null; saveCart(); renderCheckout(); var m = document.getElementById('promoMsg'); m.className = 'err'; m.textContent = (res && res.error) || 'That code is not valid.'; }
  };
  if (DATA.demo) {
    var p = SAMPLE.promos[code];
    done(p ? { ok: true, code: p.code, type: p.type, value: p.value } : { ok: false, error: 'That code is not valid.' });
    return;
  }
  msg.className = '';
  msg.textContent = 'Checking the code.';
  fetch(CONFIG.scriptUrl + '?action=promo&code=' + encodeURIComponent(code) + '&subtotal=' + encodeURIComponent(t.subtotal), { cache: 'no-store', redirect: 'follow' })
    .then(function (r) { return r.json(); }).then(done).catch(function () { done({ ok: false, error: 'The code could not be checked. Try again in a moment.' }); });
}

function placeOrder() {
  var d = readDraft();
  var errors = validateDraft(d);
  showErrors(errors);
  if (Object.keys(errors).length) return;
  var payload = {
    token: CONFIG.token, ref: orderRef, name: d.name, phone: d.phone, email: d.email, delivery: d.delivery, postal: d.postal, address: d.address,
    promo: cart.promo ? cart.promo.code : '', consent: d.consent, website: (document.getElementById('website') || {}).value || '',
    items: cart.items.map(function (l) { return { id: l.id, colour: l.colour, range: l.range, size: l.size, qty: l.qty }; })
  };
  var btn = document.getElementById('place');
  btn.disabled = true;
  btn.textContent = 'Placing your order';
  var finish = function (res) {
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = 'Place order';
      var e = {}; e[res.field && document.getElementById('err-' + res.field) ? res.field : 'form'] = res.error || 'The order could not be placed.';
      showErrors(e);
      return;
    }
    lastOrder = res;
    lastOrder.email = d.email;
    lastOrder.productId = cart.items[0].id;
    cart = { items: [], promo: null };
    saveCart();
    renderCartCount();
    orderRef = '';
    draft = { name: '', phone: '', email: '', delivery: '', address: '', postal: '', promo: '', consent: false };
    location.hash = 'order/' + encodeURIComponent(res.number || 'received');
  };
  if (DATA.demo) { finish(demoOrder(payload)); return; }
  sendOrder(payload).then(finish);
}

function sendOrder(payload) {
  var body = JSON.stringify(payload);
  /* A plain-text body is a simple request, so the browser sends it without a preflight and can read the redirected JSON reply. */
  return fetch(CONFIG.scriptUrl, { method: 'POST', body: body, redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && typeof j.ok === 'boolean') return j; throw new Error('bad reply'); })
    .catch(function () {
      /* Fallback: an opaque form post. The order still lands and the emails still go out, but the reply cannot be read. */
      return fetch(CONFIG.scriptUrl, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ payload: body }) })
        .then(function () { return { ok: true, number: '', opaque: true }; })
        .catch(function () { return { ok: false, error: 'The order could not be sent. Check your connection and try again' + (contactEmail() ? ', or email ' + contactEmail() : '') + '.' }; });
    });
}

function demoOrder(payload) {
  var n = 1042;
  try { n = Number(localStorage.getItem('qivgu-demo-orderno')) || 1042; localStorage.setItem('qivgu-demo-orderno', String(n + 1)); } catch (e) { }
  var number = 'QV-' + n;
  var t = totals(payload.delivery);
  var address = payload.address + (payload.postal ? ', ' + payload.postal.toUpperCase() : '');
  var vars = { '{total}': money(t.total), '{etransfer}': String(setting('etransfer_email') || contactEmail()), '{number}': number };
  var fill = function (s) { return String(s).replace(/\{total\}|\{etransfer\}|\{number\}/g, function (m) { return vars[m]; }); };
  var instructions = payload.delivery === 'gta' ? 'Free delivery to ' + address + '. ' + fill(setting('gta_instructions'))
    : payload.delivery === 'pickup' ? (setting('pickup_note') ? setting('pickup_note') + ' ' : '') + fill(setting('pickup_instructions'))
    : 'Shipping to ' + address + '. ' + fill(setting('ship_instructions'));
  return { ok: true, number: number, delivery: payload.delivery, subtotal: t.subtotal, discount: t.discount, shipping: t.shipping, tax: t.tax, total: t.total, instructions: instructions, reviewUrl: reviewLink(payload.items[0].id, number), demo: true };
}

function renderConfirmation() {
  var o = lastOrder;
  document.title = 'Order received, ' + storeName();
  if (!o) { view.innerHTML = '<h1>Order received</h1><p>Check your email for the order number and what to have ready.</p><p><a href="#shop">Back to the shop</a></p>'; return; }
  var html = '<h1>Order ' + (o.number ? esc(o.number) + ' ' : '') + 'received</h1>';

  else html += '<p>Total ' + money(o.total) + '.</p><p>' + esc(o.instructions) + '</p>' + (o.demo ? '<p>Sample shop: nothing was recorded and no email was sent.</p>' : '<p>We emailed a copy to ' + esc(o.email) + '.</p>');
  if (o.reviewUrl) html += '<p>Once it is in your hands, <a href="' + esc(o.reviewUrl) + '" target="_blank" rel="noopener">leave a review</a>.</p>';
  html += '<p><a href="#shop">Back to the shop</a></p>';
  view.innerHTML = html;
}

    '<h2>Privacy</h2><p>We keep your name, phone number, email and address to deliver your order and to send you the order emails. If you tick the box at checkout we email you when new designs come out; reply to any email to stop. We do not share or sell your details.</p></div>';

/* ---------- events ---------- */

view.addEventListener('click', function (e) {
  var t = e.target.closest('button, a');
  if (!t) return;
  if (t.dataset.colour !== undefined) { sel.colour = t.dataset.colour; sel.size = ''; sel.range = ''; renderProduct(sel.id); return; }
  if (t.dataset.size !== undefined) { if (t.disabled) return; sel.range = t.dataset.range; sel.size = t.dataset.size; renderProduct(sel.id); return; }
  if (t.id === 'add') { addToCart(); return; }
  if (t.dataset.remove !== undefined) { cart.items.splice(Number(t.dataset.remove), 1); saveCart(); renderCartCount(); renderCart(); return; }
  if (t.id === 'applyPromo') { applyPromo(); return; }
});

view.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'qty') { sel.qty = Number(t.value) || 1; return; }
  if (t.dataset.qty !== undefined) { var l = cart.items[Number(t.dataset.qty)]; if (l) { l.qty = Number(t.value) || 1; saveCart(); renderCartCount(); renderCart(); } return; }
  if (t.name === 'delivery') { readDraft(); renderCheckout(); return; }
});

view.addEventListener('submit', function (e) {
  if (e.target.id === 'checkout') { e.preventDefault(); placeOrder(); }
});

function addToCart() {
  var p = findProduct(sel.id);
  var msg = document.getElementById('addMsg');
  if (!p) return;
  if (!sel.range || !sel.size) { msg.className = 'err'; msg.textContent = 'Choose a size.'; return; }
  var qtySel = document.getElementById('qty');
  sel.qty = qtySel ? Number(qtySel.value) || 1 : 1;
  var line = null;
  cart.items.forEach(function (l) { if (l.id === p.id && l.colour === sel.colour && l.range === sel.range && l.size === sel.size) line = l; });
  if (line) line.qty = Math.min(maxQty(), line.qty + sel.qty);
  else cart.items.push({ id: p.id, colour: sel.colour, range: sel.range, size: sel.size, qty: sel.qty });
  saveCart();
  renderCartCount();
  msg.className = '';
  msg.innerHTML = 'Added to the cart. <a href="#cart">View cart</a>';
}

/* ---------- chrome, music, structured data ---------- */

function applyChrome() {
  var name = storeName();
  document.getElementById('wordmark').textContent = name;
  document.title = name;
  var ann = DATA.demo ? SAMPLE.announcement : String(setting('announcement') || '');
  document.getElementById('announceText').textContent = ann;
  document.getElementById('announce').classList.toggle('hidden', !ann);
  var email = contactEmail(), ig = String(setting('instagram') || CONFIG.instagram);
  document.getElementById('footEmail').textContent = email;
  document.getElementById('footEmail').classList.toggle('hidden', !email);
  document.getElementById('footInstagram').textContent = ig ? 'Instagram: ' + ig : '';
  document.getElementById('footInstagram').classList.toggle('hidden', !ig);
  document.getElementById('footCopy').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  var music = String(setting('music_url') || CONFIG.musicUrl);
  if (music) {
    document.getElementById('musicLine').classList.remove('hidden');
    document.getElementById('music').textContent = String(setting('music_label') || CONFIG.musicLabel || 'Play the song');
    document.getElementById('musicCredit').textContent = String(setting('music_credit') || CONFIG.musicCredit || '');
    setupMusic(music);
  }
}

function setupMusic(url) {
  var btn = document.getElementById('music');
  var label = btn.textContent;
  var audio = null;
  btn.addEventListener('click', function () {
    if (audio && !audio.paused) { audio.pause(); audio.currentTime = 0; btn.textContent = label; return; }
    if (!audio) { audio = new Audio(url); audio.loop = false; audio.addEventListener('ended', function () { btn.textContent = label; }); }
    audio.play().then(function () { btn.textContent = 'Stop'; }).catch(function () { btn.textContent = label; });
  });
}

function injectJsonLd() {
  if (DATA.demo || !DATA.products.length) return;
  var ld = {
    '@context': 'https://schema.org', '@type': 'ItemList', name: storeName(),
    itemListElement: DATA.products.map(function (p, i) {
      var item = { '@type': 'Product', name: p.name, url: CONFIG.siteUrl + '#p/' + encodeURIComponent(p.id), brand: { '@type': 'Brand', name: storeName() },
        offers: { '@type': 'Offer', priceCurrency: 'CAD', price: p.price, availability: p.allSoldOut ? 'https://schema.org/SoldOut' : 'https://schema.org/InStock', url: CONFIG.siteUrl + '#p/' + encodeURIComponent(p.id) } };
      if (p.description) item.description = p.description;
      var img = firstImage(p);
      if (img) item.image = /^https?:/.test(img) ? img : CONFIG.siteUrl + img.replace(/^\//, '');
      return { '@type': 'ListItem', position: i + 1, item: item };
    })
  };
  var s = document.createElement('script');
  s.type = 'application/ld+json';
  s.textContent = JSON.stringify(ld);
  document.head.appendChild(s);
}

function reviewLink(productId, number) {
  var t = String(setting('review_form_url') || '');
  if (!t) return '';
  return t.replace(/\{product\}/g, encodeURIComponent(productId)).replace(/\{order\}/g, encodeURIComponent(number || ''));
}

/* ---------- utilities ---------- */

function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function yes(v) { return /^(yes|y|true|1|x|on)$/i.test(String(v === undefined || v === null ? '' : v).trim()); }
function list(v) { return String(v === undefined || v === null ? '' : v).split(/[,;\n]+/).map(function (s) { return s.trim(); }).filter(Boolean); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function money(n) { return '$' + round2(num(n)).toFixed(2).replace(/\.00$/, ''); }
function range1(n) { var out = []; for (var i = 1; i <= n; i++) out.push(i); return out; }

/* ---------- start ---------- */

renderCartCount();
window.addEventListener('hashchange', route);
loadData().then(function () { pruneCart(); applyChrome(); route(); injectJsonLd(); });
})();
</script>
